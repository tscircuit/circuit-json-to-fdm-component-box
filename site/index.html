<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert Circuit JSON into a printable, labeled 3MF component box."
    />
    <title>Circuit JSON to FDM Component Box</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 20px;
        color: #202124;
        background: #f7f7f7;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 28px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: white;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      p {
        color: #606368;
      }

      .upload-area {
        display: block;
        margin-top: 24px;
        padding: 42px 20px;
        border: 2px dashed #999;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
      }

      .upload-area:hover,
      .upload-area.dragover {
        border-color: #333;
        background: #fafafa;
      }

      input[type="file"] {
        display: none;
      }

      .file-info,
      .status {
        margin-top: 16px;
      }

      .file-info {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }

      .file-info:empty,
      .status:empty,
      .preview[hidden] {
        display: none;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        padding: 10px 16px;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: white;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      button.primary {
        border-color: #222;
        background: #222;
        color: white;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .status.error {
        color: #b42318;
      }

      .preview {
        margin-top: 24px;
      }

      .preview h2 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .preview img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #ddd;
        border-radius: 6px;
      }

      @media (max-width: 520px) {
        main {
          padding: 20px;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Circuit JSON to FDM Component Box</h1>
      <p>
        Create a labeled, multi-material 3MF component box from a Circuit JSON
        file. Conversion happens in your browser.
      </p>

      <label class="upload-area" id="uploadArea" for="fileInput">
        <strong>Drop Circuit JSON here</strong><br />
        <span>or click to choose a file</span>
      </label>
      <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
      />

      <div class="file-info" id="fileInfo"></div>

      <div class="actions">
        <button class="primary" id="convertButton" type="button" disabled>
          Convert to 3MF
        </button>
        <button id="downloadButton" type="button" disabled>
          Download 3MF
        </button>
        <button id="clearButton" type="button">Clear</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>

      <section class="preview" id="preview" hidden>
        <h2>Preview</h2>
        <img id="previewImage" alt="Generated FDM component box preview" />
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
